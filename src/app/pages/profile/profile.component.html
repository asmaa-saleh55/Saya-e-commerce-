<div class="min-h-screen bg-[#efe8df]">
  <div class="max-w-[1400px] mx-auto px-8 py-10 flex gap-10 items-start">
    
    <aside class="w-[320px] min-w-[320px] bg-[#efe8df] rounded-[24px] p-8 min-h-[750px] flex flex-col justify-between">
      <div class="space-y-3">
        <button (click)="setTab('profile')" [class.bg-[#1a1410]]="activeTab==='profile'" [class.text-white]="activeTab==='profile'" class="w-full flex items-center gap-4 px-7 py-4 rounded-full text-[16px] font-medium text-[#6b5d53] transition-all">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          My Profile
        </button>
        <button (click)="setTab('orders')" [class.bg-[#1a1410]]="activeTab==='orders'" [class.text-white]="activeTab==='orders'" class="w-full flex items-center gap-4 px-7 py-4 rounded-full text-[16px] font-medium text-[#6b5d53] transition-all">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          My Orders
        </button>
        <button (click)="setTab('wishlist')" [class.bg-[#1a1410]]="activeTab==='wishlist'" [class.text-white]="activeTab==='wishlist'" class="w-full flex items-center gap-4 px-7 py-4 rounded-full text-[16px] font-medium text-[#6b5d53] transition-all">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          Wishlist
        </button>
        <button (click)="setTab('addresses')" [class.bg-[#1a1410]]="activeTab==='addresses'" [class.text-white]="activeTab==='addresses'" class="w-full flex items-center gap-4 px-7 py-4 rounded-full text-[16px] font-medium text-[#6b5d53] transition-all">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Addresses
        </button>
      </div>
      <button (click)="logout()" class="flex items-center gap-4 px-7 py-4 text-[16px] font-medium text-[#6b5d53] hover:text-black">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </aside>

    <!-- MAIN CARD - كبرته -->
    <main class="flex-1 flex justify-center">
      <!-- WISHLIST -->
      <div *ngIf="activeTab==='wishlist'" class="w-full max-w-[900px] bg-[#fdfbf8] rounded-[28px] shadow-[0_10px_40px_rgba(0,0,0,0.06)] p-10">
        <h2 class="text-[20px] tracking-[5px] font-serif mb-8">WISHLIST</h2>
        <div *ngIf="wishlistItems.length===0" class="text-center py-24 text-[16px] text-[#8a7f77]">No favorites yet</div>
        <div class="grid grid-cols-2 gap-7">
          <div *ngFor="let item of wishlistItems" class="border border-[#ede7df] rounded-[20px] p-4 bg-white hover:shadow-md transition">
            <div class="w-full h-[180px] bg-[#f9f6f2] rounded-[16px] overflow-hidden flex items-center justify-center">
              <img [src]="item.image || item.images?.[0] || item.imageUrl" class="w-full h-full object-contain" />
            </div>
            <p class="text-[16px] font-semibold mt-4">{{item.name}}</p>
            <p class="text-[14px] text-[#8a7f77] mt-1">{{item.price}} EGP</p>
            <button (click)="removeFromWishlist(item.id)" class="w-full mt-4 border border-[#e8e0d8] py-3 rounded-full text-[14px] hover:bg-[#ffeaea] hover:text-red-500 hover:border-red-200 transition">Remove from Wishlist ✕</button>
          </div>
        </div>
      </div>

      <!-- PROFILE -->
      <div *ngIf="activeTab==='profile'" class="w-full max-w-[900px] bg-[#fdfbf8] rounded-[28px] shadow-[0_10px_40px_rgba(0,0,0,0.06)] p-10">
        <h2 class="text-center text-[20px] tracking-[5px] font-serif mb-8">MY PROFILE</h2>
        <div class="flex flex-col items-center mb-8">
          <div class="relative">
            <div class="w-[90px] h-[90px] rounded-full bg-[#c2c2c2] overflow-hidden flex items-center justify-center"><img *ngIf="avatarUrl" [src]="avatarUrl" class="w-full h-full object-cover"/><span *ngIf="!avatarUrl">👤</span></div>
            <label class="absolute -right-1 bottom-0 w-8 h-8 bg-[#1a1410] rounded-full flex items-center justify-center cursor-pointer text-white text-[12px]">✏️<input type="file" hidden (change)="onAvatarChange($event)"/></label>
          </div>
          <p class="text-[13px] text-[#8a7f77] mt-3">Upload photo</p>
        </div>
        <form [formGroup]="profileForm" (ngSubmit)="save()" class="space-y-5">
          <div class="grid grid-cols-2 gap-5">
            <div><label class="text-[12px] font-semibold">Full Name</label><input formControlName="fullName" class="w-full mt-2 bg-[#fdfaf6] border border-[#e8e0d8] rounded-[12px] px-5 py-3 text-[14px]"/></div>
            <div><label class="text-[12px] font-semibold">Email</label><input formControlName="email" class="w-full mt-2 bg-[#fdfaf6] border border-[#e8e0d8] rounded-[12px] px-5 py-3 text-[14px]"/></div>
            <div><label class="text-[12px] font-semibold">Phone</label><input formControlName="phone" class="w-full mt-2 bg-[#fdfaf6] border border-[#e8e0d8] rounded-[12px] px-5 py-3 text-[14px]"/></div>
            <div><label class="text-[12px] font-semibold">Date of Birth</label><input formControlName="dob" type="date" class="w-full mt-2 bg-[#fdfaf6] border border-[#e8e0d8] rounded-[12px] px-5 py-3 text-[14px]"/></div>
            <div><label class="text-[12px] font-semibold">Governorate</label><select formControlName="governorate" class="w-full mt-2 bg-[#fdfaf6] border rounded-[12px] px-5 py-3 text-[14px]"><option value="">Select governorate</option><option *ngFor="let g of governorates" [value]="g">{{g}}</option></select></div>
            <div><label class="text-[12px] font-semibold">City</label><select formControlName="city" class="w-full mt-2 bg-[#fdfaf6] border rounded-[12px] px-5 py-3 text-[14px]"><option value="">Select city</option><option *ngFor="let c of filteredCities" [value]="c">{{c}}</option></select></div>
          </div>
          <div><label class="text-[12px] font-semibold">Address</label><input formControlName="address" class="w-full mt-2 bg-[#fdfaf6] border rounded-[12px] px-5 py-3 text-[14px]"/></div>
          <button type="submit" class="w-full bg-[#1a1410] text-white py-4 rounded-[12px] text-[15px] mt-6">Save Changes</button>
        </form>
      </div>

      <!-- ORDERS -->
      <div *ngIf="activeTab==='orders'" class="w-full max-w-[900px] bg-[#fdfbf8] rounded-[28px] shadow p-10">
        <h2 class="text-[20px] tracking-[5px] font-serif mb-8">MY ORDERS</h2>
        <div *ngIf="cartItems.length>0"><div *ngFor="let i of cartItems" class="flex gap-4 border-b py-4"><img [src]="i.image" class="w-20 h-20 rounded object-cover"/><div><p class="text-[15px] font-bold">{{i.name}} ({{i.size}})</p><p class="text-[13px]">{{i.price}} x {{i.quantity}}</p></div></div></div>
        <div *ngIf="cartItems.length===0" class="text-center py-20 text-[15px] text-[#8a7f77]">No orders yet</div>
      </div>

    </main>
  </div>
</div>
