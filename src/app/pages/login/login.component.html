<div class="min-h-[80vh] flex items-center justify-center px-6 py-6 relative" 
     style="background-image: url('/assets/images/saya-bg.jpg'); background-size: cover; background-position: center;">
  
  <div class="absolute inset-0 bg-[#F8F3EE]/30 backdrop-blur-[6px]"></div>

  <form (ngSubmit)="onLogin()" 
        class="bg-[#FFFBF8]/90 backdrop-blur-[16px] p-7 md:p-8 rounded-[24px] border border-white/80 w-full max-w-[400px] shadow-[0_15px_40px_rgba(61,43,36,0.12)] relative z-10">

    <!-- Logo - صغرته -->
    <h1 class="font-serif text-[36px] tracking-[0.15em] text-center text-[#2B1B14] mb-4">SAYA</h1>

    <!-- Titles - صغرتهم -->
    <h2 class="font-sans text-[26px] font-medium text-center text-black mb-1">Welcome back</h2>
    <p class="text-center text-[13px] text-[#6B5A51] mb-5">Please sign in to your account</p>

    @if (error) {
      <div class="mb-3 rounded-full border border-red-200 bg-red-50/80 px-5 py-2.5 text-[12px] text-red-700 text-center">
        {{ error }}
      </div>
    }

    <!-- Email -->
    <div class="mb-3">
      <label class="block text-[13px] text-[#4A3A33] mb-1.5 ml-1">Email</label>
      <input name="email" [(ngModel)]="email" type="email" placeholder="email@example.com" 
        class="w-full border border-[#D9CFC6] rounded-full px-5 py-2.5 text-[13px] bg-white/80 focus:bg-white focus:outline-none focus:border-[#3D2B24] transition"/>
    </div>

    <!-- Password -->
    <div class="mb-1">
      <label class="block text-[13px] text-[#4A3A33] mb-1.5 ml-1">Password</label>
      <div class="relative">
        <input name="password" [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" 
          class="w-full border border-[#D9CFC6] rounded-full px-5 py-2.5 pr-12 text-[13px] bg-white/80 focus:bg-white focus:outline-none focus:border-[#3D2B24] transition"/>
        <button type="button" (click)="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#9C8E86]">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="flex justify-end mb-4">
      <a routerLink="/forgot-password" class="text-[12px] text-black hover:underline">Forgot password?</a>
    </div>

    <button type="submit" class="w-full bg-[#4A372F] text-white rounded-full py-2.5 text-[14px] font-medium hover:bg-[#2B1B14] transition">Login</button>

    <p class="text-center text-[13px] text-[#6B5A51] mt-4">
      Don't have an account? <a routerLink="/register" class="text-black font-semibold underline underline-offset-4 ml-1">Sign up</a>
    </p>

    <p class="text-center text-[10px] text-[#8A7D77] mt-5">
      © 2024 SAYA · Privacy · Terms
    </p>
  </form>
</div>
