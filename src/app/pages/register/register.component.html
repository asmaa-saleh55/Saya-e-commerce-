<div class="min-h-[90vh] flex items-center justify-center px-6 py-10 relative" 
     style="background-image: url('/assets/images/saya-bg.jpg'); background-size: cover; background-position: center;">
  
  <div class="absolute inset-0 bg-[#F8F3EE]/20 backdrop-blur-[8px]"></div>

  <form (ngSubmit)="onRegister()" 
        class="bg-[#FFFBF8]/80 backdrop-blur-[22px] p-8 md:p-10 rounded-[28px] border border-white/70 w-full max-w-[440px] shadow-[0_20px_60px_rgba(61,43,36,0.12)] relative z-10">

    <h1 class="font-serif text-[42px] tracking-[0.15em] text-center text-[#2B1B14] mb-6">SAYA</h1>
    <h2 class="text-[28px] font-medium text-center text-black mb-1">Create account</h2>
    <p class="text-center text-[14px] text-[#6B5A51] mb-6">Join SAYA family</p>

    @if (error) {
      <div class="mb-4 rounded-full border border-red-200 bg-red-50/80 px-5 py-2.5 text-[12px] text-red-700 text-center">
        {{ error }}
      </div>
    }

    <div class="mb-3">
      <label class="block text-[13px] text-[#4A3A33] mb-1.5 ml-1">Full Name</label>
      <input name="name" [(ngModel)]="name" placeholder="Full Name" 
        class="w-full border border-[#D9CFC6] rounded-full px-5 py-3 text-[13px] bg-white/60 focus:bg-white focus:outline-none focus:border-[#3D2B24] transition"/>
    </div>

    <div class="mb-3">
      <label class="block text-[13px] text-[#4A3A33] mb-1.5 ml-1">Email</label>
      <input name="email" [(ngModel)]="email" type="email" placeholder="email@example.com" 
        class="w-full border border-[#D9CFC6] rounded-full px-5 py-3 text-[13px] bg-white/60 focus:bg-white focus:outline-none focus:border-[#3D2B24] transition"/>
    </div>

    <div class="mb-3">
      <label class="block text-[13px] text-[#4A3A33] mb-1.5 ml-1">Phone Number</label>
      <input name="phone" [(ngModel)]="phone" type="tel" placeholder="01xxxxxxxxx" 
        class="w-full border border-[#D9CFC6] rounded-full px-5 py-3 text-[13px] bg-white/60 focus:bg-white focus:outline-none focus:border-[#3D2B24] transition"/>
    </div>

    <div class="mb-3">
      <label class="block text-[13px] text-[#4A3A33] mb-1.5 ml-1">Password</label>
      <div class="relative">
        <input name="password" [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" 
          class="w-full border border-[#D9CFC6] rounded-full px-5 py-3 pr-12 text-[13px] bg-white/60 focus:bg-white focus:outline-none focus:border-[#3D2B24] transition"/>
        <button type="button" (click)="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#9C8E86]">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-[13px] text-[#4A3A33] mb-1.5 ml-1">Confirm Password</label>
      <input name="confirmPassword" [(ngModel)]="confirmPassword" type="password" placeholder="••••••••" 
        class="w-full border border-[#D9CFC6] rounded-full px-5 py-3 text-[13px] bg-white/60 focus:bg-white focus:outline-none focus:border-[#3D2B24] transition"/>
    </div>

    <button type="submit" class="w-full bg-[#4A372F] text-white rounded-full py-3.5 text-[15px] font-medium hover:bg-[#2B1B14] transition">Create Account</button>

    <p class="text-center text-[14px] text-[#6B5A51] mt-6">
      Already have an account? <a routerLink="/login" class="text-black font-semibold underline underline-offset-4">Login</a>
    </p>
  </form>
</div>
