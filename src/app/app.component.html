<nav class="flex justify-between items-center w-full px-12 lg:px-16 py-4 sticky top-0 z-50 bg-[#EDE6DB] border-b border-[#F3E9DE]">
  <a routerLink="/home" class="text-[24px] font-serif tracking-[0.32em] font-light text-[#3D2B24] shrink-0 ">SAYA</a>
  
  <div class="flex items-center gap-8">
    <!-- Links in middle - same gap -->
    <div class="flex items-center gap-2 text-[15px] text-[#3D2B24]">
      <a routerLink="/home" routerLinkActive #homeAct="routerLinkActive" [routerLinkActiveOptions]="{exact: true}">
        <span class="px-5 py-2 rounded-full transition-all duration-300 block"
          [ngClass]="homeAct.isActive ? 'bg-[#3D2B24] text-white' : 'hover:bg-[#F9F1E8]'">
          Home
        </span>
      </a>
      <a routerLink="/shop" routerLinkActive #shopAct="routerLinkActive">
        <span class="px-5 py-2 rounded-full transition-all duration-300 tracking-[0.2em] text-[15px] block"
          [ngClass]="shopAct.isActive ? 'bg-[#3D2B24] text-white' : 'hover:bg-[#F9F1E8]'">
          Shop
        </span>
      </a>
      <a routerLink="/our-story" routerLinkActive #storyAct="routerLinkActive">
        <span class="px-5 py-2 rounded-full transition-all duration-300 block"
          [ngClass]="storyAct.isActive ? 'bg-[#3D2B24] text-white' : 'hover:bg-[#F9F1E8]'">
          Our Story
        </span>
      </a>
      <a routerLink="/contact" routerLinkActive #contactAct="routerLinkActive">
        <span class="px-5 py-2 rounded-full transition-all duration-300 block"
          [ngClass]="contactAct.isActive ? 'bg-[#3D2B24] text-white' : 'hover:bg-[#F9F1E8]'">
          Contact
        </span>
      </a>
    </div>

    <!-- Cart + Profile - fixed gap -->
    <div class="flex items-center gap-3 pl-8 border-l border-[#F3E9DE]">
      <a routerLink="/cart" class="flex items-center gap-2 px-4 py-2 text-[15px] hover:bg-[#F9F1E8] rounded-full transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24">
          <path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span>Cart <span *ngIf="cartCount > 0">({{cartCount}})</span></span>
      </a>

      <a [routerLink]="auth.user() ? '/profile' : '/login'" routerLinkActive #profAct="routerLinkActive"
        class="w-8 h-8 rounded-full border flex items-center justify-center transition-all"
        [ngClass]="profAct.isActive ? 'bg-[#3D2B24] text-white border-[#3D2B24]' : 'border-[#E8DDD0] hover:bg-[#3D2B24] hover:text-white hover:border-[#3D2B24]'">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24">
          <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </a>
    </div>
  </div>
</nav>
  <div class="flex-grow">
    <router-outlet></router-outlet>
  </div>
  <app-footer></app-footer>
